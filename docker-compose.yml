services:
  # Base de Datos Local (PostgreSQL 16 para paridad con Supabase)
  fixflow-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=fixflow_db
      - POSTGRES_USER=fixflow
      - POSTGRES_PASSWORD=FixFlowAdmin2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixflow -d fixflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fixflow-network

  # Emulador de Azure Storage (pendiente de migración a Supabase Storage en Épica 6)
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    networks:
      - fixflow-network

  # API REST Multi-Tenant
  fixflow-api:
    build:
      context: .
      dockerfile: src/FixFlow.API/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=fixflow-db;Port=5432;Database=fixflow_db;Username=fixflow;Password=FixFlowAdmin2026!
      - AzureWebJobsStorage=UseDevelopmentStorage=true;
    depends_on:
      fixflow-db:
        condition: service_healthy
      azurite:
        condition: service_started
    networks:
      - fixflow-network

volumes:
  postgres_data:

networks:
  fixflow-network:
    driver: bridge
