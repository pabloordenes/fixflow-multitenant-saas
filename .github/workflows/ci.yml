name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore Shared, API, and Web projects
        run: |
          dotnet restore src/FixFlow.Shared/FixFlow.Shared.csproj
          dotnet restore src/FixFlow.API/FixFlow.API.csproj
          dotnet restore src/FixFlow.Web/FixFlow.Web.csproj

      - name: Build Shared, API, and Web projects
        run: |
          dotnet build src/FixFlow.Shared/FixFlow.Shared.csproj --configuration Release --no-restore
          dotnet build src/FixFlow.API/FixFlow.API.csproj --configuration Release --no-restore
          dotnet build src/FixFlow.Web/FixFlow.Web.csproj --configuration Release --no-restore

      - name: Run Integration Tests
        run: |
          if [ -f "tests/FixFlow.API.IntegrationTests/FixFlow.API.IntegrationTests.csproj" ]; then
            dotnet test tests/FixFlow.API.IntegrationTests/FixFlow.API.IntegrationTests.csproj --configuration Release --verbosity normal
          else
            echo "No integration test project found on this branch yet."
          fi
